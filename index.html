<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Platinum dental smile</title>
  <meta name="description" id="pageDesc" content="Platinum dental smile — trusted dental care in your city. Book appointments via WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
</head>
<body>

  <!-- ═══════════════════════════ HEADER ═══════════════════════════ -->
  <header id="header">
    <div class="container header-inner">
      <a href="#" class="logo" id="logo"></a>
      <nav id="nav">
        <ul class="nav-list" id="navList"></ul>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════ HERO ═══════════════════════════ -->
  <section class="hero" id="home">
    <div class="hero-bg-img" id="heroBg"></div>
    <div class="hero-bg-shape"></div>
    <div class="container hero-inner">
      <div class="hero-content" id="heroContent"></div>
      <div class="hero-visual" id="heroVisual"></div>
    </div>
    <div class="hero-wave">
      <svg viewBox="0 0 1440 80" preserveAspectRatio="none" fill="#ffffff">
        <path d="M0,40 C360,80 1080,0 1440,40 L1440,80 L0,80 Z"/>
      </svg>
    </div>
  </section>

  <!-- ═══════════════════════════ ABOUT ═══════════════════════════ -->
  <section class="section" id="about">
    <div class="container about-inner" id="aboutInner"></div>
  </section>

  <!-- ═══════════════════════════ SERVICES ═══════════════════════════ -->
  <section class="section section-ice" id="services">
    <div class="container">
      <div class="section-header" id="servicesHeader"></div>
      <div class="services-grid" id="servicesGrid"></div>
    </div>
  </section>

  <!-- ═══════════════════════════ WHY US ═══════════════════════════ -->
  <section class="section" id="why-us">
    <div class="container">
      <div class="section-header" id="whyHeader"></div>
      <div class="why-grid" id="whyGrid"></div>
    </div>
  </section>

  <!-- ═══════════════════════════ ACADEMIC ═══════════════════════════ -->
  <section class="section" id="academic">
    <div class="container">
      <div class="section-header" id="academicHeader"></div>
      <div class="academic-inner" id="academicInner"></div>
      <div class="academic-grid" id="academicGrid"></div>
    </div>
  </section>

  <!-- ═══════════════════════════ DOCTOR ═══════════════════════════ -->
  <section class="section section-navy" id="doctor">
    <div class="container doctor-inner" id="doctorInner"></div>
  </section>

  <!-- ═══════════════════════════ TESTIMONIALS ═══════════════════════════ -->
  <section class="section section-ice" id="testimonials">
    <div class="container">
      <div class="section-header" id="testiHeader"></div>
      <div class="testimonials-grid" id="testiGrid"></div>
    </div>
  </section>

  <!-- ═══════════════════════════ EXPERIENCE ═══════════════════════════ -->
  <section class="section" id="experience">
    <div class="container">
      <div class="section-header" id="expHeader"></div>
      <div class="experience-grid" id="expGrid"></div>
    </div>
  </section>

    <!-- ═══════════════════════════ APPOINTMENT ═══════════════════════════ -->
  <section class="section section-ice" id="appointment">
    <div class="container appt-inner" id="apptInner"></div>
  </section>

  <!-- ═══════════════════════════ CONTACT + MAP ═══════════════════════════ -->
  <section class="section" id="contact">
    <div class="container">
      <div class="section-header" id="contactHeader"></div>
      <div class="contact-inner" id="contactInner"></div>
    </div>
  </section>

  <!-- ═══════════════════════════ FOOTER ═══════════════════════════ -->
  <footer class="footer">
    <div class="container footer-inner" id="footerInner"></div>
    <div class="footer-bottom">
      <div class="container footer-bottom-inner" id="footerBottom"></div>
    </div>
  </footer>

  <!-- Floating WhatsApp Button -->
  <a href="#" target="_blank" class="whatsapp-float" id="whatsappFloat" aria-label="Chat on WhatsApp"></a>

  <script src="script.js"></script>
</body>
</html>
